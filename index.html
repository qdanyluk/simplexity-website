<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simplexity Safety Solutions</title>
  <meta name="description" content="Transforming complex safety challenges into clear, actionable solutions." />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #FAF8F4;
      color: #1B3A6B;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      text-align: center;
      max-width: 900px;
      width: 100%;
      animation: fadeIn 1.2s ease-out;
    }

    .logo {
      max-width: 100%;
      width: 100%;
      max-width: 720px;
      height: auto;
      margin: 0 auto 3rem;
      display: block;
    }

    .tagline {
      font-size: clamp(1.125rem, 2.5vw, 1.5rem);
      font-weight: 400;
      color: #1B3A6B;
      letter-spacing: 0.01em;
      line-height: 1.5;
      max-width: 640px;
      margin: 0 auto;
      position: relative;
      padding-bottom: 1.5rem;
    }

    .tagline::after {
      content: '';
      display: block;
      width: 60px;
      height: 2px;
      background-color: #4A90D9;
      margin: 1.5rem auto 0;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .logo {
        margin-bottom: 2rem;
      }

      .tagline {
        padding: 0 1rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="/logo.png" alt="Simplexity Safety Solutions" class="logo" />
    <p class="tagline">Transforming complex safety challenges into clear, actionable solutions.</p>
  </main>
</body>
</html>
